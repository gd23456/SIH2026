[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends()/File() defaults are the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
